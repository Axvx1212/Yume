<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Yume</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#161826">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- NOT black-translucent. In an installed PWA that style makes iOS draw the
     web view full-screen while sizing the viewport short by the status-bar
     height, stranding a dead strip at the bottom exactly as tall as the top
     inset (measured: 59px on iPhone 14 Pro). "black" gives the status bar its
     own strip and a viewport that matches the area below it. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Yume">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="app" class="app">
  <main id="view" class="view" aria-live="polite"></main>

  <nav id="tabbar" class="tabbar" hidden>
    <a class="tab" href="#/library" data-tab="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6v14H4zM14 5h6v14h-6z"/></svg>
      <span>Library</span>
    </a>
    <a class="tab" href="#/browse" data-tab="browse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span>Browse</span>
    </a>
    <a class="tab" href="#/more" data-tab="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>
      <span>More</span>
    </a>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
