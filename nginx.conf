# Yume — static app + reverse proxy to Suwayomi.
#
# The point of the proxy is same-origin: the browser only ever talks to this
# container, so /api/graphql and every /api/v1/... image look local and CORS
# never applies. `suwayomi` resolves over the shared Docker network — change it
# to match the Suwayomi service name in your compose file.

# Only send "Connection: upgrade" when the client actually asked to upgrade.
# Hardcoding it puts an upgrade token on every ordinary GraphQL POST, which
# breaks upstream keepalive and is rejected outright by stricter HTTP stacks.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  _;

    # Docker's embedded DNS, for the case where YUME_UPSTREAM is a compose
    # service name on a shared network.
    #
    # NOTE: nginx's resolver speaks DNS only — it does NOT consult /etc/hosts.
    # `extra_hosts` (host.docker.internal:host-gateway) writes to /etc/hosts,
    # so a variable proxy_pass would fail to resolve it even though the host is
    # perfectly reachable. proxy_pass therefore uses ${YUME_UPSTREAM} directly:
    # substituted at startup by envsubst, resolved by the system resolver,
    # which does read /etc/hosts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root  /usr/share/nginx/html;
    index index.html;

    # Suwayomi is on the LAN; pages are large and plentiful.
    client_max_body_size 64m;

    # ── app shell ────────────────────────────────────────────────────────
    # Hash routing means any unknown path should still return index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location /icons/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── GraphQL ──────────────────────────────────────────────────────────
    location /api/graphql {
        proxy_pass         http://${YUME_UPSTREAM};
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # GraphQL subscriptions upgrade to a websocket; plain POSTs don't.
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # ── images and everything else under /api ────────────────────────────
    # Covers /api/v1/manga/*/thumbnail, /api/v1/manga/*/chapter/*/page/*,
    # and /api/v1/extension/icon/*.
    location /api/ {
        proxy_pass         http://${YUME_UPSTREAM};
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Page images are immutable once fetched — let the phone keep them.
        # (No proxy_cache zone is declared, so no server-side caching happens
        # here; Suwayomi already caches fetched pages on disk. A bare
        # proxy_cache_valid would be silently ignored, so it isn't set.)
        expires            7d;
        add_header         Cache-Control "public";

        proxy_read_timeout 300s;
    }
}
